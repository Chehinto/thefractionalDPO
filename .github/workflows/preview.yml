# A real URL for every pull request.
#
# The two Vercel projects here were created from the CLI and are not connected
# to this repository through Vercel's Git integration, so nothing deploys a pull
# request on its own. This is that feature, built from the CLI.
#
# It deploys to the STAGING project as a preview. A preview gets its own URL and
# its own build; it never touches the staging project's canonical URL, which
# only a push to the staging branch moves.
#
# Fork pull requests are skipped on purpose. This job holds a token that can
# deploy, and `pull_request` from a fork runs code the author controls — a
# preview URL is not worth handing that token to a stranger. This repository is
# public, so that is not hypothetical. The PR and Tests workflows still run on
# forks, because neither holds anything.

name: Preview

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy a preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Deploy
        id: deploy
        run: |
          url="$(npx --yes vercel@59.12.0 deploy --yes --token="${{ secrets.VERCEL_TOKEN }}" \
            | awk '/^https:\/\// { u=$0 } END { print u }')"
          if [ -z "$url" ]; then
            echo "No deployment URL came back from Vercel" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Edited in place rather than appended, so a branch pushed ten times has
      # one comment showing the current preview instead of ten showing old ones.
      - name: Put the URL on the pull request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.deploy.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. Deployment
            Protection applies — open it signed in to Vercel.
